## Dados de conexão com o dbh2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=master
spring.datasource.password=

##config do cliente web do dbh2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

##config para mostrar sql no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

## Habilita a DDL automática do Hibernate
spring.jpa.hibernate.ddl-auto=create-drop

## FORÇA o Spring a esperar a DDL ser criada antes de rodar os scripts de dados
spring.jpa.defer-datasource-initialization=true

## Habilita a execução dos scripts de inicialização
spring.sql.init.mode=always

##debug no stacktrace
logging.level.org.springframework.security=DEBUG